workflows:
  android-apk:
    name: Balu Design Team - Android APK
    max_build_duration: 60
    instance_type: linux_x2
    working_directory: balu-design-team-app
    environment:
      node: 20
      vars:
        PACKAGE_NAME: "com.baludesignteam.app"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Expo prebuild (generate native android project)
        script: npx expo prebuild --platform android --non-interactive
      - name: Build debug APK
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - balu-design-team-app/android/app/build/outputs/**/*.apk